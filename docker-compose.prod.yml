services:
  exameow:
    image: exameow-server:latest
    container_name: exameow-server
    ports:
      - "3000:3000"
    environment:
      - AI_ENDPOINT=${AI_ENDPOINT}
      - AI_API_KEY=${AI_API_KEY}
      - AI_MODEL=${AI_MODEL}
      - PORT=3000
      - RUST_LOG=info
      - ADMIN_TOKEN=${ADMIN_TOKEN:-pass}
      # Everything the platform stores lives under /app/data, which MUST be a persistent volume (below):
      # without it the accounts, exams, attachments, the encryption key and the backups vanish whenever the
      # container is recreated.
      - EXAM_DB_PATH=/app/data/exameow.db
      - ADMIN_TOKEN_FILE=/app/data/admin_token.txt
      - PLATFORM_DB_PATH=/app/data/exameow-platform.db
      - PLATFORM_FILES_DIR=/app/data/platform-files
      - PLATFORM_KEY_FILE=/app/data/platform.key
      - PLATFORM_ADMIN_EMAIL=${PLATFORM_ADMIN_EMAIL:-}
      - PLATFORM_ADMIN_PASSWORD=${PLATFORM_ADMIN_PASSWORD:-}
      # Backups go to /app/data/backups (same volume). Optional tuning:
      #   PLATFORM_BACKUP_HOUR=3          UTC hour of the nightly backup, or "off"
      #   PLATFORM_BACKUP_KEEP=7          nightly backups kept
      #   PLATFORM_BACKUP_KEEP_MANUAL=5   manual backups kept
    volumes:
      - exameow-data:/app/data
    restart: unless-stopped

volumes:
  exameow-data:
